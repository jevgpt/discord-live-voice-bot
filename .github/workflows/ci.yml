name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:locales
      - run: npm run test:unit
      - run: npm run selftest
      # The speech server's engines, routing and HTTP checks, with fakes only: no torch, no model downloads.
      # (test:unit runs it too when a python3 is found; this step fails outright if it is missing.)
      - run: python3 -m unittest -v tools/test_voice_server.py
